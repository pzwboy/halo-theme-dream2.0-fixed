<div xmlns:th="https://www.thymeleaf.org"
     th:fragment="widget (sidebar)"
     th:class="'card widget ' + ${sidebar.hide}">
<div class="card-title">
        <i th:class="${#strings.defaultString(sidebar.icon, 'ri-chat-quote-line') + ' card-title-label'}"></i><span th:text="${#strings.defaultString(sidebar.title, 'HITOKOTO')}"></span>
</div>
<div class="card-content">
        <div id="hitokoto">
  <p id="hitokoto_text">Hitokoto 获取中...</p>
  <p id="hitokoto_from" style="text-align: right;"></p>
</div>
<script>
  fetch('${theme.config.sidebar.hitokoto_api}')
    .then(response => response.json())
    .then(data => {
      const hitokoto = document.querySelector('#hitokoto_text')
      hitokoto.innerText = "『" + data.hitokoto + "』";
      const from = document.querySelector('#hitokoto_from')
      const fromWho = data.from_who ?? '';
      const separator = fromWho ? " " : "";
      
      from.innerText = fromWho 
        ? `—— ${fromWho}「${data.from}」`
        : `—— 「${data.from}」`;
    })
    .catch(console.error)
</script>
</div>
</div>
